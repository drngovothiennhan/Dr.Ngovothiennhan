name: A.I Thiet Chan Android Build

on:
  push:
    branches: [ai-thiet-chan-native-phase1]
    paths:
      - 'ai-thiet-chan-android/**'
      - '.github/workflows/ai-thiet-chan-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-thiet-chan-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint
        run: gradle :app:lintDebug --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ai-thiet-chan-debug-apk
          path: |
            ai-thiet-chan-android/app/build/outputs/apk/debug/app-debug.apk
            ai-thiet-chan-android/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
