name: A.I Thiet Chan Web CI

on:
  push:
    branches: [ai-thiet-chan-web-rebuild]
    paths:
      - 'ai-thiet-chan-web/**'
      - '.github/workflows/ai-thiet-chan-web-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-thiet-chan-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run check
