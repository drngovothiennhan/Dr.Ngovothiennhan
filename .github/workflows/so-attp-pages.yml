name: Deploy Sổ ATTP to GitHub Pages
on:
  push:
    branches: [so-attp-neon-rebuild]
    paths:
      - 'apps/so-attp-neon/frontend/**'
      - '.github/workflows/so-attp-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: so-attp-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/so-attp-neon/frontend
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
