services:
  - type: web
    name: so-attp-api
    runtime: node
    region: virginia
    plan: free
    buildCommand: cd apps/so-attp-neon/server && npm install
    startCommand: cd apps/so-attp-neon/server && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: ATTP_BUCKET
        value: attp-documents
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_OCR_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_VERIFY_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: https://so-attp-neon.onrender.com

  - type: web
    name: so-attp-neon
    runtime: static
    buildCommand: echo static-ready
    staticPublishPath: apps/so-attp-neon/frontend
