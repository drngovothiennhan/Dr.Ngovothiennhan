<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Nhập phiếu KSK tự động</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><header><div><h1>Nhập phiếu KSK tự động</h1><p>PDF/ảnh → OCR tại máy → kiểm tra → Excel</p></div><span class="badge">Không tính credit</span></header><section class="card"><label class="drop"><input id="files" type="file" accept="application/pdf,image/*" multiple><strong>Chọn PDF / hình phiếu</strong><small>Mỗi trang PDF = 1 phiếu. Dữ liệu trống giữ nguyên trống.</small></label><div class="tools"><button id="start" disabled>Nhận dạng tất cả</button><button id="clear" class="secondary">Xóa</button><button id="export" class="green" disabled>Xuất Excel</button></div><div id="progress" class="progress" hidden><div id="bar"></div></div><div id="status"></div></section><section class="stats"><div><b id="fc">0</b><span>Tệp</span></div><div><b id="rc">0</b><span>Phiếu</span></div><div><b id="wc">0</b><span>Cần kiểm tra</span></div></section><section class="card"><div class="table"><table><thead><tr><th>#</th><th>Họ tên</th><th>CCCD</th><th>SĐT</th><th>Ngày khám</th><th>Nơi khám</th><th>Trạng thái</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">Chưa có dữ liệu</td></tr></tbody></table></div></section><dialog id="dlg"><form method="dialog" id="form"><h3>Kiểm tra phiếu</h3><input type="hidden" id="rid"><div class="grid"><label>Họ tên<input id="name"></label><label>Giới tính<select id="gender"><option value=""></option><option value="1">Nam</option><option value="2">Nữ</option></select></label><label>Ngày sinh<input id="dob"></label><label>Dân tộc<input id="ethnic"></label><label>CCCD<input id="idno"></label><label>BHYT<input id="bhyt"></label><label>SĐT<input id="phone"></label><label>Nghề nghiệp<input id="job"></label><label>Đối tượng khám<input id="target"></label><label>Hình thức khám<input id="examType"></label><label>Ngày khám<input id="examDate"></label><label>Nơi khám<input id="examPlace"></label><label>Phường/xã<input id="ward"></label><label>Tỉnh/TP<input id="city"></label></div><label>Địa chỉ<textarea id="address"></textarea></label><label>Kết quả<textarea id="result"></textarea></label><div class="tools right"><button value="cancel" class="secondary">Đóng</button><button id="save" value="default">Lưu</button></div></form></dialog></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script type="module" src="./app.js"></script></body></html>
