<style>

s3:[['date','Ngày',1],['meal','Ca / bữa ăn',1],['dish','Tên món ăn',1],['servings','Số suất',1],['splitDone','Chia xong',1],['eatStart','Bắt đầu ăn',1],['utensils','Dụng cụ chia/chứa/che đậy',0],['sensory','Cảm quan',0],['action','Ghi chú',0]],
sample:[['date','Ngày',1],['sampleName','Tên mẫu thức ăn',1],['meal','Bữa ăn / giờ ăn',1],['servings','Số suất',1],['amount','Khối lượng/thể tích',1],['unit','Đơn vị g/ml',1],['container','Dụng cụ chứa',0],['temperature','Nhiệt độ °C',1],['takenAt','Thời gian lấy mẫu',1],['destroyAt','Thời gian hủy mẫu',0],['condition','Tình trạng/Ghi chú',0],['keeper','Người lưu mẫu',0],['destroyer','Người hủy mẫu',0],['sealed','Niêm phong',0]]
};
const state=load();
let current='dashboard',kind='a',imageFile=null,imageUrl='',ocrText='',invoiceItems=[],ocrMeta={},ocrBusy=false;

function empty(){return {records:[],menus:[],stock:[],pending:[],suppliers:['CÔNG TY CỔ PHẦN THỰC PHẨM FRESCO'],settings:{sheetUrl:SHEET_URL,bridgeUrl:'',reportHour:'',zaloRecipients:''}}}
function load(){try{return Object.assign(empty(),JSON.parse(localStorage.getItem('attp-render-v1')||'{}'))}catch{return empty()}}
function persist(){localStorage.setItem('attp-render-v1',JSON.stringify(state))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9.,]+/g,' ').trim()}
function note(msg,type=''){document.getElementById('notice').innerHTML='<div class="notice '+type+'">'+esc(msg)+'</div>';setTimeout(()=>{const n=document.getElementById('notice');if(n)n.innerHTML=''},8000)}
function openSheet(){window.open(state.settings.sheetUrl||SHEET_URL,'_blank')}
function setTab(t){current=t;document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(t).classList.add('active');renderNav();render()}
function renderNav(){const html=tabs.map(([id,label,ico])=>'<button class="nav '+(current===id?'active':'')+'" onclick="setTab(\''+id+'\')">'+ico+' '+label+'</button>').join('');side.innerHTML=html;bottom.innerHTML=tabs.map(([id,label,ico])=>'<button class="'+(current===id?'active':'')+'" onclick="setTab(\''+id+'\')"><div>'+ico+'</div>'+label+'</button>').join('')}
function render(){renderDashboard();renderCapture();renderMenu();renderStock();renderReports();renderSettings()}
function renderDashboard(){
 const todayRecs=state.records.filter(r=>(r.fields?.date||r.createdAt?.slice(0,10))===today());
 const review=state.records.filter(r=>r.status==='CẦN DÒ LẠI').length;
 const exp=state.stock.filter(x=>daysLeft(x.expiry)<=7).length;
 dashboard.innerHTML='<h2>Tổng quan hôm nay</h2><p class="muted">Dữ liệu lưu cục bộ trên máy và xếp hàng đồng bộ Google Sheets.</p><div class="stats"><div class="stat">Bản ghi hôm nay<strong>'+todayRecs.length+'</strong></div><div class="stat">Cần dò lại<strong>'+review+'</strong></div><div class="stat">HSD ≤ 7 ngày<strong>'+exp+'</strong></div><div class="stat">Chờ đồng bộ Sheet<strong>'+state.pending.length+'</strong></div></div><div class="card"><b>Nguyên tắc dữ liệu</b><p class="muted">OCR dưới 95% vẫn được phép nhập, nhưng luôn mang trạng thái CẦN DÒ LẠI. Không tự bịa HSD, giờ nhập, kiểm dịch hay cảm quan.</p></div>'
}
function captureActions(){return '<div class="upload-actions"><button class="primary" onclick="cameraInput.click()">📷 Chụp ảnh</button><button class="secondary" onclick="galleryInput.click()">🖼️ Tải ảnh từ máy</button>'+(imageFile?'<button class="primary" onclick="runOCR()">🔎 Nhận diện tự động</button>':'')+'</div>'}
function renderCapture(){
 const chips=Object.entries(stepMeta).map(([k,v])=>'<button class="chip '+(kind===k?'active':'')+'" onclick="kind=\''+k+'\';invoiceItems=[];renderCapture()">'+v.title.split(' · ')[0]+'</button>').join('');
 const img=imageUrl?'<img class="preview" src="'+imageUrl+'">'+captureActions():'<div class="uploadbox"><div style="font-size:30px">🖼️</div><b>Chọn nguồn ảnh</b><div class="muted">Hóa đơn, phiếu giao nhận, ảnh món ăn hoặc mẫu lưu</div>'+captureActions()+'</div>';
 const prog=ocrBusy?'<div class="progress"><div id="ocrbar"></div></div><div id="ocrstatus" class="small">Đang xử lý ảnh…</div>':'';
 let items='';
 if(invoiceItems.length){items='<div class="card"><b>Hóa đơn nhiều dòng · '+invoiceItems.length+' mặt hàng</b><p class="muted">Sửa tên/số lượng/đơn vị nếu cần. Dòng dưới 95% vẫn nhập được nhưng được gắn CẦN DÒ LẠI.</p>'+invoiceItems.map((x,i)=>'<div class="item '+(x.confidence<THRESHOLD?'warn':'')+'"><div class="itemgrid"><input type="checkbox" '+(x.selected?'checked':'')+' onchange="invoiceItems['+i+'].selected=this.checked"><input value="'+esc(x.name)+'" oninput="invoiceItems['+i+'].name=this.value"><input value="'+esc(x.qty)+'" oninput="invoiceItems['+i+'].qty=this.value"><input class="widehide" value="'+esc(x.unit)+'" oninput="invoiceItems['+i+'].unit=this.value"><select onchange="invoiceItems['+i+'].kind=this.value"><option value="a" '+(x.kind==='a'?'selected':'')+'>1a</option><option value="b" '+(x.kind==='b'?'selected':'')+'>1b</option></select></div><div class="small">Mã '+esc(x.code||'—')+' · OCR '+x.confidence+'% '+(x.confidence<THRESHOLD?'· cần dò lại':'')+'</div></div>').join('')+'<button class="primary" style="width:100%" onclick="saveInvoiceItems()">💾 Nhập các dòng đã chọn</button></div>'}
 const form=defs[kind].map(([key,label,req])=>'<label>'+label+(req?' *':'')+'<input id="f_'+key+'" value="'+esc(ocrMeta[key]?.value||'')+'" class="'+((ocrMeta[key]?.confidence||100)<THRESHOLD?'warn':'')+'" placeholder="'+(key==='receivedAt'?'YYYY-MM-DD hoặc YYYY-MM-DDTHH:mm':'')+'">'+((ocrMeta[key]?.value&&ocrMeta[key]?.confidence<100)?'<span class="small">OCR '+ocrMeta[key].confidence+'%</span>':'')+'</label>').join('');
 capture.innerHTML='<h2>Chụp & nhập sổ</h2><p class="muted">Camera và thư viện ảnh tách riêng. OCR chạy miễn phí trên thiết bị, không dùng credit AppDeploy.</p><div class="chips">'+chips+'</div><div class="card"><b>'+stepMeta[kind].title+'</b></div><div class="card">'+img+prog+(ocrText?'<details><summary>Văn bản OCR gốc</summary><pre class="code">'+esc(ocrText)+'</pre></details>':'')+'</div>'+items+'<div class="card"><b>Kiểm tra dữ liệu trước khi lưu</b><div class="grid2" style="margin-top:12px">'+form+'</div><button class="primary" style="width:100%;margin-top:14px" onclick="saveSingle()">💾 Lưu bản ghi</button></div>'
}
cameraInput.onchange=e=>selectImage(e.target.files?.[0]);galleryInput.onchange=e=>selectImage(e.target.files?.[0]);
function selectImage(f){if(!f)return;imageFile=f;if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(f);ocrText='';invoiceItems=[];ocrMeta={};renderCapture()}
async function preprocess(file){
 const bmp=await createImageBitmap(file);
 const longest=Math.max(bmp.width,bmp.height);
 const scale=Math.min(2.2,Math.max(1.25,2600/longest));
 const c=document.createElement('canvas');
 c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);
 const x=c.getContext('2d',{willReadFrequently:true});
 x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
 x.drawImage(bmp,0,0,c.width,c.height);
 const d=x.getImageData(0,0,c.width,c.height);
 for(let i=0;i<d.data.length;i+=4){
   const y=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2];
   const v=Math.max(0,Math.min(255,(y-128)*1.6+142));
   d.data[i]=d.data[i+1]=d.data[i+2]=v;
 }
 x.putImageData(d,0,0);
 return c;
}
function cropCanvas(src,y0,y1){
 const c=document.createElement('canvas');c.width=src.width;c.height=Math.max(1,Math.round(src.height*(y1-y0)));
 c.getContext('2d').drawImage(src,0,Math.round(src.height*y0),src.width,c.height,0,0,c.width,c.height);
 return c;
}
function tokenScore(a,b){
 const A=new Set(norm(a).split(' ').filter(x=>x.length>2)),B=new Set(norm(b).split(' ').filter(x=>x.length>2));
 if(!A.size||!B.size)return 0;let hit=0;for(const w of A)if(B.has(w))hit++;return hit/Math.max(A.size,B.size);
}
function bestSupplier(lines){
 const bad=/khach hang|trường|truong|mã số thuế|ma so thue|điện thoại|dien thoai|dia chi|địa chỉ|fax|ngày|ngay|số:|so:/i;
 const candidates=lines.slice(0,14).filter(x=>!bad.test(norm(x))&&/cong ty|công ty|cty|thuc pham|thực phẩm|food/i.test(x)&&x.length<140);
 const known=state.suppliers||[];
 for(const c of candidates){
   if(/fresco/i.test(c))return {value:'CÔNG TY CỔ PHẦN THỰC PHẨM FRESCO',confidence:99};
   let best='',score=0;
   for(const k of known){const s=tokenScore(c,k);if(s>score){score=s;best=k}}
   if(score>=.5)return {value:best,confidence:Math.round(80+score*19)};
 }
 const c=candidates[0]||'';
 return c?{value:c,confidence:75}:{value:'',confidence:0};
}
function parseTableWords(words,baseConf){
 const arr=(words||[]).map(w=>({text:String(w.text||'').trim(),conf:Number(w.confidence||w.conf||0),x0:w.bbox?.x0??w.bbox?.x??0,y0:w.bbox?.y0??w.bbox?.y??0,x1:w.bbox?.x1??((w.bbox?.x??0)+(w.bbox?.w??0)),y1:w.bbox?.y1??((w.bbox?.y??0)+(w.bbox?.h??0))})).filter(w=>w.text&&w.conf>=20);
 if(!arr.length)return [];
 const heights=arr.map(w=>Math.max(1,w.y1-w.y0)).sort((a,b)=>a-b);const med=heights[Math.floor(heights.length/2)]||20;
 const rows=[];
 for(const w of arr.sort((a,b)=>((a.y0+a.y1)-(b.y0+b.y1))||a.x0-b.x0)){
   const cy=(w.y0+w.y1)/2;let r=rows.find(z=>Math.abs(z.cy-cy)<=med*.65);
   if(!r){r={cy,words:[]};rows.push(r)}r.words.push(w);r.cy=(r.cy*(r.words.length-1)+cy)/r.words.length;
 }
 const units=/^(kg|kgs|g|gr|gram|l|lit|lít|ml|chai|gói|goi|hộp|hop|thùng|thung|bao|cái|cai)$/i;
 const codeRe=/^[A-Z]{1,4}[.\-]\d+(?:[.\-]\d+)?$/i;
 const numRe=/^\d+(?:[.,]\d+)?$/;
 const out=[];
 for(const r of rows){
   const ws=r.words.sort((a,b)=>a.x0-b.x0);
   let ci=ws.findIndex(w=>codeRe.test(w.text.replace(/[,;:]$/,'')));
   let ui=ws.findIndex((w,i)=>i>Math.max(ci,0)&&units.test(w.text.replace(/[.,;:]$/,'')));
   if(ui<0)continue;
   let start=ci>=0?ci+1:0;
   if(ci<0&&/^\d{1,3}$/.test(ws[0]?.text||''))start=1;
   if(start>=ui)continue;
   const name=ws.slice(start,ui).map(w=>w.text).join(' ').replace(/^[-|]+|[-|]+$/g,'').trim();
   let qi=-1;for(let i=ui+1;i<Math.min(ws.length,ui+5);i++){if(numRe.test(ws[i].text.replace(/,/g,'.'))){qi=i;break}}
   if(name.length<2||qi<0)continue;
   const qty=ws[qi].text.replace(',','.');
   const code=ci>=0?ws[ci].text.replace(/[,;:]$/,''):'';
   const rel=ws.slice(start,qi+1).map(w=>w.conf).filter(Number.isFinite);
   const conf=Math.round(rel.reduce((a,b)=>a+b,0)/Math.max(1,rel.length));
   out.push({code,name,unit:ws[ui].text.replace(/[.,;:]$/,''),qty,kind:kind==='b'?'b':'a',confidence:Math.max(50,Math.min(99,Math.round((conf+baseConf)/2))),selected:true});
 }
 const uniq=[];const seen=new Set();for(const x of out){const k=norm(x.code+' '+x.name+' '+x.qty);if(!seen.has(k)){seen.add(k);uniq.push(x)}}
 return uniq;
}
async function runOCR(){
 if(!imageFile)return;ocrBusy=true;renderCapture();
 const progress=(label,offset,span)=>m=>{if(m.status==='recognizing text'){const p=offset+(m.progress||0)*span;const b=document.getElementById('ocrbar');const s=document.getElementById('ocrstatus');if(b)b.style.width=Math.round(p*100)+'%';if(s)s.textContent=label+' '+Math.round(p*100)+'%'}};
 try{
   const full=await preprocess(imageFile);
   const header=cropCanvas(full,0,.32);
   const table=cropCanvas(full,.20,.76);
   const hres=await Tesseract.recognize(header,'vie+eng',{logger:progress('Đang đọc tiêu đề…',0,.28)});
   const tres=await Tesseract.recognize(table,'vie+eng',{logger:progress('Đang tách bảng hàng…',.28,.58)});
   const fres=await Tesseract.recognize(full,'vie+eng',{logger:progress('Đang kiểm tra chéo…',.86,.14)});
   const headerText=hres.data.text||'',tableText=tres.data.text||'',fullText=fres.data.text||'';
   ocrText=[headerText,tableText,fullText].filter(Boolean).join('\n---\n');
   const conf=Math.round(((hres.data.confidence||0)+(tres.data.confidence||0)+(fres.data.confidence||0))/3);
   parseOCR(headerText+'\n'+fullText,conf);
   invoiceItems=parseTableWords(tres.data.words||[],Math.round(tres.data.confidence||conf));
   if(!invoiceItems.length)invoiceItems=parseTextRows(tableText,Math.round(tres.data.confidence||conf));
   note(invoiceItems.length?'Đã tách '+invoiceItems.length+' dòng hàng qua 3 lượt OCR. Rà dòng vàng trước khi nhập.':'Đọc được tiêu đề nhưng chưa tách chắc bảng hàng. Hãy chụp thẳng và gần bảng hơn.','ok');
 }catch(e){note('OCR chưa xử lý được ảnh này. Ảnh vẫn được giữ để bạn thử lại hoặc nhập tay.','bad')}finally{ocrBusy=false;renderCapture()}
}
function parseTextRows(text,baseConf){
 const lines=text.split(/\r?\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean),items=[];
 const units='kg|kgs|g|gr|gram|l|lit|lít|ml|chai|gói|goi|hộp|hop|thùng|thung|bao|cái|cai';
 for(const line of lines){
   let m=line.match(new RegExp('(?:^|\\s)([A-Z]{1,4}[.\\-]\\d+(?:[.\\-]\\d+)?)\\s+(.+?)\\s+(' + units + ')\\s+([\\d.,]+)(?:\\s|$)','i'));
   if(m)items.push({code:m[1],name:m[2].trim(),unit:m[3],qty:m[4].replace(',','.'),kind:kind==='b'?'b':'a',confidence:Math.max(55,Math.min(90,baseConf)),selected:true});
 }
 return items;
}
function parseOCR(text,baseConf){
 const lines=text.split(/\r?\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
 const supplier=bestSupplier(lines);
 const invSpecific=text.match(/(?:S[oố]|No\.?|Số HĐ)\s*[:.]?\s*((?:BH|HD|HĐ)[A-Z0-9.-]{3,})/i);
 const invoice=(invSpecific?.[1]||(text.match(/\b(?:BH|HD|HĐ)[A-Z0-9.-]{3,}\b/i)||[])[0]||'').replace(/\s/g,'');
 const dateRaw=(text.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})\b/)||[]);
 const date=dateRaw.length?dateRaw[3]+'-'+dateRaw[2].padStart(2,'0')+'-'+dateRaw[1].padStart(2,'0'):'';
 if(supplier.value)ocrMeta.supplier=supplier;
 if(invoice)ocrMeta.invoice={value:invoice,confidence:Math.min(99,Math.max(85,baseConf))};
 if(date)ocrMeta.receivedAt={value:date,confidence:Math.min(94,Math.max(80,baseConf))};
}
function getForm(){const o={};for(const [k] of defs[kind])o[k]=document.getElementById('f_'+k)?.value?.trim()||'';return o}
function recordStatus(fields,conf=100){let warn=false;for(const [k,l,req] of defs[kind])if(req&&!fields[k])warn=true;if((kind==='a'||kind==='b')&&fields.receivedAt&&!/T\d{2}:\d{2}/.test(fields.receivedAt))warn=true;if(conf<THRESHOLD)warn=true;return warn?'CẦN DÒ LẠI':'ĐÃ XÁC MINH'}
function rememberSupplier(v){v=String(v||'').trim();if(v&&v.length>5){state.suppliers=state.suppliers||[];if(!state.suppliers.some(x=>norm(x)===norm(v)))state.suppliers.push(v)}}
function saveSingle(){const f=getForm();const miss=defs[kind].filter(x=>x[2]&&!f[x[0]]).map(x=>x[1]);if(miss.length)return note('Thiếu: '+miss.join(', '),'bad');rememberSupplier(f.supplier||f.manufacturer);const conf=Math.min(...Object.values(ocrMeta).filter(x=>x.value).map(x=>x.confidence||100),100);const r={id:id(),kind,createdAt:new Date().toISOString(),fields:f,confidence:conf,status:recordStatus(f,conf)};saveRecord(r);note('Đã lưu '+r.status+'. Dòng vẫn được xếp hàng đồng bộ Google Sheets.','ok');render()}
function saveInvoiceItems(){
 const shared=getForm();const chosen=invoiceItems.filter(x=>x.selected);if(!chosen.length)return note('Chưa chọn dòng nào.','bad');if(!shared.receivedAt||!shared.supplier)return note('Cần điền ngày/thời gian nhập và cơ sở cung cấp.','bad');
 rememberSupplier(shared.supplier);
 for(const x of chosen){const k=x.kind;const fields={...shared,name:x.name,weight:x.qty,unit:x.unit};const status=(x.confidence<THRESHOLD||!shared.receivedAt.includes('T'))?'CẦN DÒ LẠI':'ĐÃ XÁC MINH';saveRecord({id:id(),kind:k,createdAt:new Date().toISOString(),fields,confidence:x.confidence,status,itemCode:x.code})}
 note('Đã lưu '+chosen.length+' dòng; tất cả đã vào hàng chờ Google Sheets kể cả dòng CẦN DÒ LẠI.','ok');invoiceItems=[];render()}
function saveRecord(r){state.records.push(r);state.pending.push(r.id);persist();trySync()}
function sheetName(r){return r.kind==='a'||r.kind==='b'?'B1_Nhap_thuc_pham':r.kind==='s2'?'B2_Che_bien':r.kind==='s3'?'B3_Truoc_khi_an':'Luu_mau'}
function rowFor(r){const f=r.fields||{};if(r.kind==='a'||r.kind==='b')return {'ID':r.id,'Nhóm thực phẩm':r.kind==='a'?'1a - Tươi sống/đông lạnh':'1b - Khô/bao gói/phụ gia','Tên thực phẩm':f.name||'','Thời gian nhập':f.receivedAt||'','Khối lượng':f.weight||'','Đơn vị':f.unit||'','Cơ sở SX/NCC':f.supplier||f.manufacturer||'','Địa chỉ/Điện thoại':f.supplierContact||f.manufacturerAddress||'','Người giao hàng':f.deliverer||'','Chứng từ/Hóa đơn':f.invoice||'','ĐK VS thú y':f.vetRegistration||'','Giấy kiểm dịch':f.quarantine||'','Hạn sử dụng':f.expiry||'','Điều kiện bảo quản':f.storage||'','Cảm quan':f.sensory||'','Xét nghiệm nhanh':f.rapidTest||'','Kết quả':f.result||'','Biện pháp xử lý/Ghi chú':(f.action||'')+(r.itemCode?' Mã hàng '+r.itemCode:''),'Độ tin cậy OCR (%)':r.confidence||100,'Trạng thái xác minh':r.status};return {'ID':r.id,'Ngày':f.date||'','Ca/Bữa ăn':f.meal||'','Tên món ăn':f.dish||f.sampleName||'','Số lượng/Số suất':f.servings||'','Biện pháp xử lý/Ghi chú':f.action||f.condition||'','Trạng thái xác minh':r.status}}
async function trySync(){
 const url=state.settings.bridgeUrl;if(!url||!state.pending.length)return;
 const ids=[...state.pending];const records=ids.map(i=>state.records.find(r=>r.id===i)).filter(Boolean);
 try{const payload={action:'appendBatch',spreadsheetId:'1BcRDGO9oTiPeGFxHe7oYspvYaQKR0dxnjBPZlqZzgAI',items:records.map(r=>({sheet:sheetName(r),row:rowFor(r)}))};const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const j=await res.json();if(j.ok){state.pending=state.pending.filter(x=>!ids.includes(x));persist();note('Đã đồng bộ '+records.length+' dòng sang Google Sheets.','ok');renderDashboard()}}catch(e){}
}
function renderMenu(){menu.innerHTML='<h2>Thực đơn & đối chiếu</h2><div class="card"><div class="grid2"><label>Ngày<input id="m_date" type="date" value="'+today()+'"></label><label>Bữa<input id="m_meal" value="Trưa"></label></div><label style="margin-top:10px">Mỗi dòng: Tên món | Nguyên liệu chính | Số suất<textarea id="m_lines" rows="7"></textarea></label><button class="primary" onclick="saveMenu()">Lưu thực đơn</button></div><div class="card"><b>Thực đơn đã lưu</b>'+state.menus.slice(-30).reverse().map(x=>'<div class="item">'+esc(x.date)+' · '+esc(x.meal)+' · <b>'+esc(x.dish)+'</b> · '+x.servings+' suất</div>').join('')+'</div>'}
function saveMenu(){const date=m_date.value,meal=m_meal.value;const lines=m_lines.value.split(/\n/).map(x=>x.trim()).filter(Boolean);for(const l of lines){const [dish,ingredients='',servings='0']=l.split('|').map(x=>x.trim());if(dish)state.menus.push({id:id(),date,meal,dish,ingredients,servings:Number(servings)||0})}persist();note('Đã lưu thực đơn.','ok');renderMenu()}
function daysLeft(d){if(!d)return 9999;return Math.ceil((new Date(d+'T23:59:59')-Date.now())/86400000)}
function renderStock(){stock.innerHTML='<h2>Xuất nhập kho</h2><p class="muted">Tồn = tồn đầu + nhập − xuất − lưu mẫu.</p><div class="card"><div class="grid4">'+[['name','Tên thực phẩm'],['received','Ngày nhập'],['expiry','HSD'],['lot','Số lô'],['opening','Tồn đầu'],['inQty','Nhập'],['outQty','Xuất'],['sampleQty','Lưu mẫu'],['unit','Đơn vị'],['supplier','Nhà cung cấp'],['location','Vị trí'],['storage','Bảo quản']].map(([k,l])=>'<label>'+l+'<input id="st_'+k+'" '+(k==='received'||k==='expiry'?'type="date"':'')+' value="'+(k==='received'?today():'')+'"></label>').join('')+'</div><button class="primary" style="margin-top:12px" onclick="saveStock()">Nhập kho</button></div><div class="card table-wrap"><table class="tbl"><tr><th>Thực phẩm</th><th>Tồn</th><th>HSD</th><th>Trạng thái</th></tr>'+state.stock.map(x=>{const bal=Number(x.opening||0)+Number(x.inQty||0)-Number(x.outQty||0)-Number(x.sampleQty||0),d=daysLeft(x.expiry);return '<tr><td>'+esc(x.name)+'</td><td>'+bal+' '+esc(x.unit)+'</td><td>'+esc(x.expiry)+'</td><td><span class="badge '+(d<0?'b-red':d<=7?'b-warn':'b-ok')+'">'+(d<0?'QUÁ HẠN':d<=7?'SẮP HẾT HẠN':'CÒN HẠN')+'</span></td></tr>'}).join('')+'</table></div>'}
function saveStock(){const keys=['name','received','expiry','lot','opening','inQty','outQty','sampleQty','unit','supplier','location','storage'];const x={id:id()};keys.forEach(k=>x[k]=document.getElementById('st_'+k).value);if(!x.name||!x.expiry)return note('Kho cần tên thực phẩm và HSD.','bad');state.stock.push(x);persist();note('Đã lưu kho.','ok');renderStock()}
function reportText(period){
 let start,end=new Date();const now=new Date();if(period==='day')start=new Date();else if(period==='week'){start=new Date();start.setDate(now.getDate()-((now.getDay()+6)%7))}else start=new Date(now.getFullYear(),now.getMonth(),1);const s=start.toISOString().slice(0,10),e=end.toISOString().slice(0,10);const rec=state.records.filter(r=>{const d=r.fields?.date||r.fields?.receivedAt?.slice(0,10)||r.createdAt.slice(0,10);return d>=s&&d<=e});const exp=state.stock.filter(x=>daysLeft(x.expiry)<=7).length;return 'BÁO CÁO ATTP TRƯỜNG HỌC\nKỳ: '+s+' → '+e+'\n• Bước 1: '+rec.filter(r=>r.kind==='a'||r.kind==='b').length+' dòng\n• Bước 2: '+rec.filter(r=>r.kind==='s2').length+' dòng\n• Bước 3: '+rec.filter(r=>r.kind==='s3').length+' dòng\n• Mẫu lưu: '+rec.filter(r=>r.kind==='sample').length+'\n• Cần dò lại: '+rec.filter(r=>r.status==='CẦN DÒ LẠI').length+'\n• HSD ≤7 ngày/quá hạn: '+exp+'\n• Chờ đồng bộ Google Sheets: '+state.pending.length}
function renderReports(){reports.innerHTML='<h2>Báo cáo</h2><div class="card"><div class="chips"><button class="chip" onclick="showReport(\'day\')">Ngày</button><button class="chip" onclick="showReport(\'week\')">Tuần</button><button class="chip" onclick="showReport(\'month\')">Tháng</button></div><textarea id="reportbox" rows="14">'+esc(reportText('day'))+'</textarea></div>'}
function showReport(p){reportbox.value=reportText(p)}
const bridgeCode=`const SPREADSHEET_ID='1BcRDGO9oTiPeGFxHe7oYspvYaQKR0dxnjBPZlqZzgAI';
function doPost(e){try{const b=JSON.parse(e.postData.contents||'{}');if(b.action==='appendBatch'){for(const it of (b.items||[]))append(it.sheet,it.row||{});return out({ok:true,count:(b.items||[]).length});}return out({ok:false,message:'action'});}catch(err){return out({ok:false,message:String(err)});}}
function append(name,row){const sh=SpreadsheetApp.openById(SPREADSHEET_ID).getSheetByName(name);if(!sh)throw new Error('Missing '+name);const h=sh.getRange(1,1,1,sh.getLastColumn()).getDisplayValues()[0];sh.appendRow(h.map(k=>Object.prototype.hasOwnProperty.call(row,k)?row[k]:''));}
function out(x){return ContentService.createTextOutput(JSON.stringify(x)).setMimeType(ContentService.MimeType.JSON);}`;

function saveSettings(){state.settings.bridgeUrl=set_bridge.value.trim();persist();note('Đã lưu cấu hình. Đang thử đồng bộ hàng chờ…','ok');trySync();renderSettings()}
